      <p>You can reach our customer support via phone, email, or the form below.</p>
      <div style="display:flex;gap:2rem;align-items:flex-start;">
        <div>
          <p><strong>Phone</strong>: +1 (555) 123-4567</p>
          <p><strong>Email</strong>: <a href="mailto:support@abdullah.com">support@abdullah.com</a></p>
          <p><strong>Address</strong>:Engineers town C2 House number 237 </p>
        </div>
        <form>
          <input name="name" placeholder="Your name">
          <input name="email" placeholder="Your email">
          <textarea name="message" placeholder="Your message"></textarea>
          <button type="submit">Send message</button>
        </form>
      </div>
    </section>
